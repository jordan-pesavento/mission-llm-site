<!doctype html>
<!--
  Share card source (Open Graph and X): public/og/mission-llm.png, 1200 x 630.
  Not part of the site build and never published: it is rendered once to a PNG.
  Matches the home hero (positioning pass, 2026-09-26): the hero's navy ground with its subtle vertical
  gradient, the inverse horizontal lockup (public/brand/lockup-horizontal-inverse.svg), the home H1 and
  the eyebrow line on the left, and the hero scene (public/images/scenes/hero-scene.svg: the lit
  classroom tiers, the in-house server with the ML mark and its node, and the answer card) on the right.
  The scene carries its own floor grid, so there is no drafting lattice. The mark is always paired with
  the wordmark on first contact (DESIGN-SPEC section 10).
  Fonts load from the repo: Clash Display from public/fonts, Plus Jakarta Sans from node_modules/@fontsource.
  Render: node scripts/og/render-og.mjs (Chrome from D:/DevCache/puppeteer; writes the raw capture to
  OG_WORK_DIR and the compressed PNG to public/og/mission-llm.png). Keep the text in step with
  SITE.shareImageAlt in src/data/site.ts and the home hero.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mission LLM share card</title>
    <style>
      @font-face {
        font-family: "Clash Display";
        src: url("../../public/fonts/clash-display/ClashDisplay-Medium.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("../../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, #0c1736 0%, #070f26 58%);
        color: #ffffff;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 84px;
        width: 600px;
      }
      .lockup {
        display: block;
        height: 44px;
        width: auto;
      }
      h1 {
        margin-top: 72px;
        font-family: "Clash Display", sans-serif;
        font-weight: 500;
        font-size: 92px;
        line-height: 1.02;
        letter-spacing: -0.028em;
      }
      p {
        margin-top: 30px;
        max-width: 540px;
        font-size: 28px;
        line-height: 1.45;
        color: #a9b5cc;
      }
      .scene {
        position: absolute;
        right: -24px;
        top: 44px;
        width: 656px;
        height: 550px;
      }
      .scene img {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <img class="lockup" src="../../public/brand/lockup-horizontal-inverse.svg" alt="" />
      <h1>Your class,<br />your model.</h1>
      <p>A private, offline AI system for schools and teams, on your own hardware.</p>
    </div>
    <div class="scene">
      <img src="../../public/images/scenes/hero-scene.svg" width="656" height="550" alt="" />
    </div>
  </body>
</html>
