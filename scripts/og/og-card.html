<!doctype html>
<!--
  Share card source (Open Graph and X): public/og/mission-llm.png, 1200 x 630.
  Not part of the site build and never published: it is rendered once to a PNG.
  The redesign's look: the plain mist-50 page ground, the full-color horizontal lockup
  (public/brand/lockup-horizontal.svg), the home H1 and a one-line summary on the left, and the lecture
  hall on a local server (the redrawn scene with the ML mark, scripts/og/lecture-hall.svg; the same
  drawing as the /editions hero once that page uses the redrawn file) on the drafting lattice on the
  right. The mark is always paired with the wordmark on first contact (DESIGN-SPEC section 10).
  Fonts load from the repo: Clash Display from public/fonts, Plus Jakarta Sans from node_modules/@fontsource.
  Render: node scripts/og/render-og.mjs (Chrome from D:/DevCache/puppeteer; writes the raw capture to
  OG_WORK_DIR and the compressed PNG to public/og/mission-llm.png). Keep the text in step with
  SITE.shareImageAlt in src/data/site.ts and the home hero.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mission LLM share card</title>
    <style>
      @font-face {
        font-family: "Clash Display";
        src: url("../../public/fonts/clash-display/ClashDisplay-Medium.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("../../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        overflow: hidden;
        background: #f8fafc;
        color: #070f26;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 84px;
        width: 600px;
      }
      .lockup {
        display: block;
        height: 44px;
        width: auto;
      }
      h1 {
        margin-top: 72px;
        font-family: "Clash Display", sans-serif;
        font-weight: 500;
        font-size: 92px;
        line-height: 1.02;
        letter-spacing: -0.028em;
      }
      p {
        margin-top: 30px;
        max-width: 540px;
        font-size: 28px;
        line-height: 1.45;
        color: #47546f;
      }
      .scene {
        position: absolute;
        right: -20px;
        top: 96px;
        width: 640px;
        height: 480px;
        isolation: isolate;
      }
      /* The drafting lattice behind the drawing, fading toward the edges (as .drafting on the site). */
      .scene::before {
        content: "";
        position: absolute;
        inset: -8% -10%;
        z-index: -1;
        background-image: url("../../public/images/lattice.svg");
        background-size: 48px 27.713px;
        background-position: center;
        opacity: 0.34;
        -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent 100%);
      }
      .scene img {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <img class="lockup" src="../../public/brand/lockup-horizontal.svg" alt="" />
      <h1>Your class,<br />answered.</h1>
      <p>A course assistant that answers from your readings and lists its sources.</p>
    </div>
    <div class="scene">
      <img src="lecture-hall.svg" width="640" height="480" alt="" />
    </div>
  </body>
</html>
