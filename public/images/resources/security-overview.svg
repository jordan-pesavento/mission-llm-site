<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 443 215" width="443" height="215" fill="none" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <!-- Resource card: Security overview. A small version of the /security data-flow diagram:
       browser, server, local model and storage inside your network; one dashed path out to the
       providers you configure. Mission navy, mist lines, the accent only on the outbound arrow.
       Labels are 12 units or larger (9px at 390); the secondary ones (class art-sm) hide below 640. -->
  <rect width="443" height="215" fill="#070F26"/>
  <rect x="20.5" y="20.5" width="280" height="174" rx="12" fill="#A9BAD6" fill-opacity="0.035" stroke="#A9BAD6" stroke-opacity="0.3"/>
  <text class="art-sm" x="36" y="44" font-size="11" font-weight="500" letter-spacing="1.2" fill="#A3AFC8">YOUR NETWORK</text>

  <g stroke="#A9BAD6" stroke-opacity="0.5" stroke-width="1.5">
    <path d="M113 92H130"/>
    <path d="M170 123V144"/>
    <path d="M253 123V144"/>
  </g>

  <rect x="36.5" y="67.5" width="76" height="50" rx="8" fill="#111B37" stroke="#A9BAD6" stroke-opacity="0.22"/>
  <text x="74.5" y="96.5" font-size="12.5" font-weight="600" fill="#E6ECF8" text-anchor="middle">Browser</text>

  <rect x="130.5" y="61.5" width="154" height="62" rx="10" fill="#111B37" stroke="#5B95FF" stroke-opacity="0.6"/>
  <image href="/mission-llm-emblem.svg" x="143" y="79" width="26" height="26"/>
  <text x="178" y="90" font-size="13" font-weight="600" fill="#FFFFFF">Mission LLM</text>
  <text class="art-sm" x="178" y="106" font-size="11" fill="#A3AFC8">server</text>

  <rect x="126.5" y="144.5" width="88" height="36" rx="8" fill="#111B37" stroke="#A9BAD6" stroke-opacity="0.22"/>
  <text x="170.5" y="167" font-size="12" font-weight="600" fill="#E6ECF8" text-anchor="middle">Local model</text>
  <rect x="222.5" y="144.5" width="62" height="36" rx="8" fill="#111B37" stroke="#A9BAD6" stroke-opacity="0.22"/>
  <text x="253.5" y="167" font-size="12" font-weight="600" fill="#E6ECF8" text-anchor="middle">Storage</text>

  <path d="M285 92H317" stroke="#5B95FF" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M316 87.5L324 92L316 96.5Z" fill="#5B95FF"/>

  <rect x="327.5" y="67.5" width="96" height="50" rx="8" stroke="#9BBEFF" stroke-opacity="0.55" stroke-dasharray="3 3"/>
  <text x="375.5" y="90" font-size="12.5" font-weight="600" fill="#E6ECF8" text-anchor="middle">Providers</text>
  <text class="art-sm" x="375.5" y="106" font-size="11" fill="#A3AFC8" text-anchor="middle">you configure</text>
  <text class="art-sm" x="328" y="140" font-size="11" fill="#A3AFC8">Leaves only when</text>
  <text class="art-sm" x="328" y="155" font-size="11" fill="#A3AFC8">you configure it.</text>
</svg>
